version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Passw0rd2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - taskmanager-net

  backend-api:
    build:
      context: ./backend
      dockerfile: src/TaskManager.API/Dockerfile
    container_name: taskmanager-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=TaskManagerDb;User Id=sa;Password=YourStrong@Passw0rd2026!;TrustServerCertificate=True;
      - JwtSettings__Secret=EnterpriseSuperSecretKey2026MustBeAtLeast32BytesLong!
      - JwtSettings__Issuer=TaskManagerAPI
      - JwtSettings__Audience=TaskManagerApp
      - JwtSettings__ExpiryMinutes=120
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - taskmanager-net

  frontend-ui:
    build:
      context: ./frontend/task-manager-ui
      dockerfile: Dockerfile
    container_name: taskmanager-ui
    ports:
      - "4200:80"
    depends_on:
      - backend-api
    networks:
      - taskmanager-net

volumes:
  sqlserver_data:

networks:
  taskmanager-net:
    driver: bridge
