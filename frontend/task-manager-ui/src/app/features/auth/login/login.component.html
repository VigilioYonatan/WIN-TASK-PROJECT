<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p class="text-muted">Accede al Sistema de Gestión de Tareas</p>
    </div>

    <div *ngIf="errorMessage()" class="alert-error">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="form-control"
          placeholder="ejemplo@rimac.com"
        />
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error-text">
          <span *ngIf="loginForm.get('email')?.hasError('required')">El correo es requerido.</span>
          <span *ngIf="loginForm.get('email')?.hasError('email')">Formato de correo no válido.</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          placeholder="••••••••"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error-text">
          <span *ngIf="loginForm.get('password')?.hasError('required')">La contraseña es requerida.</span>
          <span *ngIf="loginForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="isLoading()">
        {{ isLoading() ? 'Iniciando sesión...' : 'Ingresar' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>¿No tienes cuenta? <a routerLink="/auth/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
