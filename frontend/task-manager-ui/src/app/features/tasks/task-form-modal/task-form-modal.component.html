<div class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>{{ taskToEdit ? 'Editar Tarea' : 'Nueva Tarea' }}</h3>
      <button (click)="onCancel()" class="btn-close">&times;</button>
    </div>

    <div *ngIf="errorMessage()" class="alert-error">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="titulo">Título *</label>
        <input
          id="titulo"
          type="text"
          formControlName="titulo"
          class="form-control"
          placeholder="Ej. Revisión de póliza de salud"
        />
        <div *ngIf="taskForm.get('titulo')?.touched && taskForm.get('titulo')?.invalid" class="error-text">
          <span *ngIf="taskForm.get('titulo')?.hasError('required')">El título es obligatorio.</span>
          <span *ngIf="taskForm.get('titulo')?.hasError('maxlength')">Máximo 150 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          formControlName="descripcion"
          class="form-control"
          rows="3"
          placeholder="Detalles sobre las acciones a realizar..."
        ></textarea>
        <div *ngIf="taskForm.get('descripcion')?.touched && taskForm.get('descripcion')?.invalid" class="error-text">
          <span *ngIf="taskForm.get('descripcion')?.hasError('maxlength')">Máximo 1000 caracteres.</span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label class="form-label" for="fechaInicio">Fecha de Inicio *</label>
          <input
            id="fechaInicio"
            type="datetime-local"
            formControlName="fechaInicio"
            class="form-control"
          />
        </div>

        <div class="form-group col">
          <label class="form-label" for="fechaCierre">Fecha de Cierre *</label>
          <input
            id="fechaCierre"
            type="datetime-local"
            formControlName="fechaCierre"
            class="form-control"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col">
          <label class="form-label" for="categoriaId">Categoría *</label>
          <select id="categoriaId" formControlName="categoriaId" class="form-control">
            <option *ngFor="let cat of categoryService.categories()" [value]="cat.id">
              {{ cat.nombre }}
            </option>
          </select>
        </div>

        <div class="form-group col">
          <label class="form-label" for="estado">Estado *</label>
          <select id="estado" formControlName="estado" class="form-control">
            <option *ngFor="let est of estados" [value]="est.value">
              {{ est.label }}
            </option>
          </select>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" (click)="onCancel()" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
          {{ isLoading() ? 'Guardando...' : (taskToEdit ? 'Actualizar' : 'Crear Tarea') }}
        </button>
      </div>
    </form>
  </div>
</div>
